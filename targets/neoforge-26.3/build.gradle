plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}


// Shared-source layout used by the Jukebox 360 multiversion repository.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../../shared/neoforge-26x/java']
        }
        resources {
            srcDirs = ['src/main/resources', '../../shared/neoforge-26x/resources', '../../shared/global/resources']
        }
    }
}
version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

jar {
    from('../../LICENSE') { into('META-INF') }
    archiveFileName = "Jukebox_360-neoforge-26.3.x-v${mod_version}.jar"
    manifest {
        attributes([
            'Implementation-Title': 'Jukebox 360',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'macatmovie'
        ])
    }
}
